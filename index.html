<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澄屿 · 图片收藏馆</title>
<style>
:root {
  --green:#75bda5;
  --deep:#397d69;
  --pale:#e7f5ee;
  --text:#42665a;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 15% 10%,#c5e9db 0,transparent 40%),
    radial-gradient(ellipse at 90% 35%,#d5eee8 0,transparent 40%),
    linear-gradient(145deg,#f4faf5,#e4f3ed 55%,#d7eee7);
  background-attachment:fixed;
}
body:before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  opacity:.35;
  background:repeating-radial-gradient(
    ellipse at 20% 10%,
    transparent 0 22px,
    #fff 23px 25px,
    transparent 26px 43px
  );
  mask-image:linear-gradient(to bottom,black,transparent 65%);
}
header{
  padding:34px 22px 25px;
  background:linear-gradient(135deg,#b9e1d1cc,#eff9f1cc);
  border-bottom:1px solid #ffffffaa;
  border-radius:0 0 32px 32px;
  box-shadow:0 8px 30px #609c8120;
  position:relative;
}
.brand{font-size:27px;font-weight:750;letter-spacing:3px}
.subtitle{font-size:12px;letter-spacing:3px;margin-top:8px;color:#70998a}
main{max-width:760px;margin:auto;padding:22px 16px 55px;position:relative}
.card{
  background:#ffffffa8;
  border:1px solid #ffffffd9;
  border-radius:23px;
  padding:20px;
  margin-bottom:17px;
  box-shadow:0 8px 25px #609c8114;
  backdrop-filter:blur(14px);
}
h2{font-size:16px;margin:0 0 16px;font-weight:700}
input,button{font:inherit}
input[type=password],input[type=text]{
  width:100%;padding:13px 14px;
  border:1px solid #c8e3d7;
  border-radius:13px;background:#ffffffb8;
  color:var(--text);outline:none;
}
input:focus{border-color:#72bba0;box-shadow:0 0 0 3px #a8dbc533}
button{
  border:0;border-radius:13px;
  padding:12px 17px;
  background:linear-gradient(135deg,#8acbb1,#61aa91);
  color:white;font-weight:650;
  cursor:pointer;
}
button:disabled{opacity:.5}
button.secondary{background:#e2f2e9;color:#477b68}
button.danger{background:#f1deda;color:#a45e57}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:150px}
.hint{font-size:12px;line-height:1.8;color:#83a296;margin-top:10px}
.upload{
  display:block;text-align:center;
  border:1.5px dashed #91cbb3;
  border-radius:18px;padding:25px 12px;
  background:#eff9f3a8;
  cursor:pointer;
}
.upload strong{display:block;font-size:15px;margin:8px}
.upload span{font-size:12px;color:#85a99a}
.upload input{display:none}
.stats{display:flex;gap:12px;margin-top:16px}
.stat{
  flex:1;text-align:center;padding:12px 5px;
  background:#e8f5ed;border-radius:15px;
}
.stat b{display:block;font-size:21px;color:#57977e}
.stat span{font-size:11px;color:#8ba99c}
.gallery{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.photo{
  overflow:hidden;border-radius:16px;
  background:#f8fcf9;border:1px solid white;
}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photo-info{padding:10px}
.filename{font-size:11px;overflow-wrap:anywhere;margin-bottom:9px}
.photo-actions{display:flex;gap:6px}
.photo-actions button{padding:8px 6px;font-size:11px;flex:1}
#message{font-size:13px;color:#548b75;line-height:1.7;margin-top:12px}
.empty{text-align:center;color:#91aea1;padding:30px 5px;font-size:13px}
footer{text-align:center;color:#9ab7aa;font-size:11px;padding:10px}
@media(min-width:600px){
 .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
  <div class="brand">澄屿 · CHENGYU</div>
  <div class="subtitle">IMAGE COLLECTION · 一方清澈的收藏空间</div>
</header>

<main>
<section class="card">
  <h2>☘ 连接你的图片仓库</h2>
  <input id="token" type="password" placeholder="在这里输入 GitHub 访问令牌">
  <div class="hint">
    令牌仅在当前页面内存中使用，不会写入网页文件。请勿将令牌分享给别人。
  </div>
  <button style="width:100%;margin-top:13px" onclick="connect()">连接仓库</button>
</section>

<section class="card">
  <h2>✧ 收藏空间</h2>
  <label class="upload">
    <div style="font-size:28px">☁</div>
    <strong>点击选择图片</strong>
    <span>支持常见图片格式，选择后上传至 GitHub</span>
    <input id="files" type="file" accept="image/*" multiple onchange="uploadFiles()">
  </label>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>收藏图片</span></div>
    <div class="stat"><b id="status">未连接</b><span>仓库状态</span></div>
  </div>
  <div id="message">等待连接你的图片仓库……</div>
</section>

<section class="card">
  <div class="row" style="justify-content:space-between">
    <h2>♡ 我的图片</h2>
    <button class="secondary" onclick="loadImages()">刷新</button>
  </div>
  <div id="gallery" class="gallery">
    <div class="empty" style="grid-column:1/-1">连接仓库后，这里会显示你的图片</div>
  </div>
</section>
<footer>CHENGYU · 愿每一张图片都有自己的归处</footer>
</main>

<script>
const OWNER="sugilite486-source";
const REPO="ni";
const BRANCH="main";
let token="";
let images=[];

function say(message){
  document.getElementById("message").textContent=message;
}
function headers(){
  return {
    "Authorization":"Bearer "+token,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
}
async function connect(){
  token=document.getElementById("token").value.trim();
  if(!token){say("请先输入访问令牌。");return;}
  say("正在连接 GitHub……");
  try{
    const r=await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}`,
      {headers:headers()}
    );
    if(!r.ok)throw new Error("连接失败，请检查令牌和权限。");
    document.getElementById("status").textContent="已连接";
    say("连接成功！正在读取图片……");
    await loadImages();
  }catch(e){say(e.message);}
}
async function loadImages(){
  if(!token){say("请先连接仓库。");return;}
  say("正在读取图片列表……");
  try{
    const r=await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/images?ref=${BRANCH}`,
      {headers:headers()}
    );
    if(r.status===404){
      images=[];
    }else if(!r.ok){
      throw new Error("读取失败，请检查仓库权限。");
    }else{
      const data=await r.json();
      images=data.filter(x=>x.type==="file" &&
        /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(x.name));
    }
    render();
    say("图片列表已更新。");
  }catch(e){say(e.message);}
}
function render(){
  document.getElementById("count").textContent=images.length;
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";
  if(!images.length){
    gallery.innerHTML='<div class="empty" style="grid-column:1/-1">这里还没有图片，上传第一张吧 ☘</div>';
    return;
  }
  images.forEach(file=>{
    const url=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/images/${encodeURIComponent(file.name).replace(/%2F/g,"/")}`;
    const card=document.createElement("div");
    card.className="photo";
    const img=document.createElement("img");
    img.src=url;img.alt=file.name;img.loading="lazy";
    const info=document.createElement("div");
    info.className="photo-info";
    const name=document.createElement("div");
    name.className="filename";name.textContent=file.name;
    const actions=document.createElement("div");
    actions.className="photo-actions";
    const copy=document.createElement("button");
    copy.textContent="复制直链";
    copy.onclick=()=>copyLink(url);
    const del=document.createElement("button");
    del.className="danger";del.textContent="删除";
    del.onclick=()=>deleteImage(file);
    actions.append(copy,del);
    info.append(name,actions);
    card.append(img,info);
    gallery.append(card);
  });
}
async function copyLink(url){
  try{
    await navigator.clipboard.writeText(url);
    say("图片直链已复制！");
  }catch(e){say("复制失败，请手动复制："+url);}
}
async function uploadFiles(){
  const input=document.getElementById("files");
  const files=[...input.files];
  if(!token){say("请先连接仓库。");input.value="";return;}
  for(const file of files){
    try{
      say("正在上传："+file.name);
      const base64=await toBase64(file);
      const path="images/"+file.name.replace(/[\/\\]/g,"_");
      const r=await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
        {
          method:"PUT",
          headers:headers(),
          body:JSON.stringify({
            message:"Upload image: "+file.name,
            content:base64,
            branch:BRANCH
          })
        }
      );
      if(!r.ok){
        const err=await r.json();
        throw new Error(err.message||"上传失败");
      }
    }catch(e){say("上传失败："+e.message);input.value="";return;}
  }
  input.value="";
  say("上传完成！");
  await loadImages();
}
function toBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(",")[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function deleteImage(file){
  if(!confirm("确定删除图片 "+file.name+" 吗？"))return;
  try{
    say("正在删除……");
    const r=await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/images/${encodeURIComponent(file.name)}`,
      {
        method:"DELETE",
        headers:headers(),
        body:JSON.stringify({
          message:"Delete image: "+file.name,
          sha:file.sha,
          branch:BRANCH
        })
      }
    );
    if(!r.ok)throw new Error("删除失败，请检查权限。");
    say("删除成功！");
    await loadImages();
  }catch(e){say(e.message);}
}
</script>
</body>
</html>
